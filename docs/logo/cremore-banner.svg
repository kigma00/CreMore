<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 320" width="1200" height="320" role="img" aria-label="CreMore — Plaintext Credential Exposure Platform">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0b1220"/>
      <stop offset="0.55" stop-color="#0e2a22"/>
      <stop offset="1" stop-color="#08150f"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#34d399"/>
      <stop offset="1" stop-color="#0f9d6b"/>
    </linearGradient>
    <linearGradient id="shield" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#12352a"/>
      <stop offset="1" stop-color="#0a1f18"/>
    </linearGradient>
    <filter id="soft" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <rect width="1200" height="320" rx="20" fill="url(#bg)"/>
  <!-- faint scanning grid -->
  <g opacity="0.06" stroke="#8affd4" stroke-width="1">
    <path d="M0 80 H1200 M0 160 H1200 M0 240 H1200"/>
    <path d="M120 0 V320 M360 0 V320 M600 0 V320 M840 0 V320 M1080 0 V320"/>
  </g>

  <!-- emblem: shield + key + masked bar -->
  <g transform="translate(96,60)">
    <path d="M100 6 L182 34 V112 C182 168 146 196 100 214 C54 196 18 168 18 112 V34 Z"
          fill="url(#shield)" stroke="url(#accent)" stroke-width="4"/>
    <!-- key -->
    <g fill="none" stroke="url(#accent)" stroke-width="9" stroke-linecap="round" filter="url(#soft)">
      <circle cx="78" cy="92" r="26"/>
      <path d="M100 100 L146 146"/>
      <path d="M128 128 l16 16 M116 140 l14 14"/>
    </g>
    <!-- masked credential chip: hidden portion + a revealed tail (AKIA••••DRZE motif) -->
    <g transform="translate(38,162)">
      <rect x="0" y="0" width="124" height="28" rx="9" fill="#0a1f18" stroke="url(#accent)" stroke-width="2"/>
      <g fill="#2fae82">
        <circle cx="18" cy="14" r="3.4"/><circle cx="31" cy="14" r="3.4"/>
        <circle cx="44" cy="14" r="3.4"/><circle cx="57" cy="14" r="3.4"/>
      </g>
      <g fill="#8affd4">
        <rect x="74" y="7" width="6" height="14" rx="2"/>
        <rect x="87" y="7" width="6" height="14" rx="2"/>
        <rect x="100" y="7" width="6" height="14" rx="2"/>
      </g>
    </g>
  </g>

  <!-- wordmark -->
  <g transform="translate(320,150)" font-family="'Segoe UI', Helvetica, Arial, sans-serif">
    <text x="0" y="0" font-size="92" font-weight="800" letter-spacing="-2" fill="#f4fbf7">Cre<tspan fill="url(#accent)">More</tspan></text>
    <text x="4" y="52" font-size="30" font-weight="600" letter-spacing="0.5" fill="#9fd8c2">Plaintext Credential Exposure Platform</text>
    <text x="6" y="92" font-size="20" font-weight="500" fill="#5f8a7a">Self-hosted · Read-only by default · No raw secrets stored</text>
  </g>
</svg>
