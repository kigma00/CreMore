[build-system]
requires = ["hatchling==1.32.0"]
build-backend = "hatchling.build"

[project]
name = "cremore-siem-slack"
version = "0.1.0"
description = "Slack detection alerts for the CreMore durable SIEM exporter."
requires-python = ">=3.12"
license = { text = "Apache-2.0" }
dependencies = ["cremore==0.1.0"]

[project.entry-points."cremore.siem_sinks"]
slack_alerts = "cremore_siem_slack:PROVIDER"

[tool.hatch.build.targets.wheel]
packages = ["src/cremore_siem_slack"]
