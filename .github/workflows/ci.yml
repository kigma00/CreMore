name: CI

# PR updates check the web build and container images.
# Manual runs also build and install the Python wheel.
on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  python:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12", "3.14"]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Build and install the wheel outside the checkout
        run: |
          python -m venv "$RUNNER_TEMP/build-env"
          "$RUNNER_TEMP/build-env/bin/pip" install --require-hashes -r requirements-build.txt
          "$RUNNER_TEMP/build-env/bin/pip" wheel --no-deps --no-build-isolation -w "$RUNNER_TEMP/dist" .
          python -m venv "$RUNNER_TEMP/wheel-env"
          "$RUNNER_TEMP/wheel-env/bin/pip" install --require-hashes --only-binary :all: -r requirements.txt
          "$RUNNER_TEMP/wheel-env/bin/pip" install --no-deps "$RUNNER_TEMP"/dist/cremore-*.whl
          "$RUNNER_TEMP/wheel-env/bin/pip" check

  web:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22.23.2
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci --ignore-scripts
        working-directory: web
      - run: npm run build
        working-directory: web
      - name: Standalone output carries no sharp/libvips
        working-directory: web
        run: |
          if find .next/standalone -path '*node_modules/sharp*' -o -path '*node_modules/@img*' -o -iname '*libvips*' | grep -q .; then
            echo "sharp/libvips found in .next/standalone" >&2; exit 1
          fi
  containers:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          # api and worker share the Python image; the service picks the entrypoint.
          - component: api
            context: .
            file: deploy/docker/python.Dockerfile
          - component: web
            context: .
            file: web/Dockerfile
          - component: oauth2-proxy
            context: .
            file: deploy/docker/oauth2-proxy.Dockerfile
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3
      - id: build
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.file }}
          push: false
          load: true
          tags: cremore-ci:${{ matrix.component }}
          cache-from: type=gha,scope=${{ matrix.component }}
          cache-to: type=gha,mode=max,scope=${{ matrix.component }}
      # Reuse the images above for Security's pinned scanner on every PR.
      # Security also audits application images on manual and weekly runs.
      - name: Audit application image with the pinned security scanner
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        env:
          IMAGE: cremore-ci:${{ matrix.component }}
        run: |
          docker run --rm \
            -v /var/run/docker.sock:/var/run/docker.sock \
            -v "$RUNNER_TEMP/trivy-security:/root/.cache" \
            aquasec/trivy:0.74.0@sha256:62b1e65e8869bc4b4c6aa4fa2b21595256c7c2f6018a9d9ad61caf87187c1969 image \
            --scanners vuln --severity HIGH,CRITICAL --ignore-unfixed \
            --skip-files usr/local/bin/gosu --exit-code 1 --no-progress "$IMAGE"
      - uses: aquasecurity/trivy-action@a9c7b0f06e461e9d4b4d1711f154ee024b8d7ab8 # v0.36.0
        # Run both scanners even if the other one reports findings.
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        with:
          image-ref: cremore-ci:${{ matrix.component }}
          format: table
          exit-code: "1"
          severity: HIGH,CRITICAL
