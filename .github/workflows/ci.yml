name: CI

# PR updates run web, provider boundary/content contract and container checks.
# Run CI manually on the branch being reviewed before merging when the complete
# test, PostgreSQL, installed-wheel and browser suite is needed.
on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  python:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    # The PostgreSQL suite takes about 27 minutes; allow the installed-wheel
    # and provider checks below to complete within the same job.
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        # 3.12 is the oldest supported release; 3.14 is the interpreter the
        # container image ships.
        python-version: ["3.12", "3.14"]
    env:
      AWS_EC2_METADATA_DISABLED: "true"
      CREMORE_TEST_POSTGRES_URL: postgresql+psycopg://cremore_test:synthetic-ci-only@localhost:5432/cremore_test
    services:
      postgres:
        image: postgres:17-alpine@sha256:f02121de6f74d30d8a94cd1d9584125e2178d7e6c377d8130112d4e52d867995
        env:
          POSTGRES_USER: cremore_test
          POSTGRES_PASSWORD: synthetic-ci-only
          POSTGRES_DB: cremore_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U cremore_test -d cremore_test"
          --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - run: pip install -e ".[dev,gcp,azure]"
      # The catalog audit runs per detector (RE2-safety, uniqueness, over-broad
      # match rejection); keep the whole suite green, not just the fast subset.
      - run: python -m pytest -q -ra
      # The installed wheel must work without the checkout: packaged files equal the source, both
      # registries and every compatibility path resolve inside the wheel, the adapter registry keeps
      # the DB layer out, entry points load, and an offline collection runs (scripts/installed_check.py).
      # It is built and installed as deploy/docker/python.Dockerfile does: hash-pinned build tools,
      # runtime dependencies only from the hash-pinned lock, the wheel without dependencies, pip check.
      - name: Check the installed wheel outside the checkout
        run: |
          python -m venv "$RUNNER_TEMP/build-env"
          "$RUNNER_TEMP/build-env/bin/pip" install --require-hashes -r requirements-build.txt
          "$RUNNER_TEMP/build-env/bin/pip" wheel --no-deps --no-build-isolation -w "$RUNNER_TEMP/dist" .
          python -m venv "$RUNNER_TEMP/wheel-env"
          "$RUNNER_TEMP/wheel-env/bin/pip" install --require-hashes --only-binary :all: -r requirements.txt
          "$RUNNER_TEMP/wheel-env/bin/pip" install --no-deps "$RUNNER_TEMP"/dist/cremore-*.whl
          "$RUNNER_TEMP/wheel-env/bin/pip" check
          cd "$RUNNER_TEMP"
          "$RUNNER_TEMP/wheel-env/bin/python" -I "$GITHUB_WORKSPACE/scripts/installed_check.py" --source "$GITHUB_WORKSPACE"
      # Provider and contract tests collected from the installed packages (scripts/installed_tests.py);
      # the test tools are added after pip check so they cannot mask a missing runtime dependency.
      - name: Run provider and contract tests from the installed wheel
        run: |
          "$RUNNER_TEMP/wheel-env/bin/pip" install "pytest>=8.3" "jsonschema>=4.23" "rfc3339-validator>=0.1.4"
          cd "$RUNNER_TEMP"
          "$RUNNER_TEMP/wheel-env/bin/python" -I -X utf8 "$GITHUB_WORKSPACE/scripts/installed_tests.py"
      # The shared GCP library keeps its own tests; it needs no dependency of its own.
      - name: Test the shared GCP library
        run: python -m unittest discover -s tests -v
        working-directory: gcp/standalone

  # Every pull request: a provider library may not load the platform runtime, another provider
  # or an optional SDK on the registry path, and every content collector keeps its approved scope.
  # No database; the complete suite stays in the manual python job.
  boundaries:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      AWS_EC2_METADATA_DISABLED: "true"
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -e ".[dev,gcp,azure]"
      - run: >-
          python -m pytest -q -ra cremore/provider_boundaries_test.py cremore/sources/module_contract_test.py
          cremore/worker/content_contract_test.py
      - name: Check Slack alert plugin and durable producers without external sends
        run: |
          pip install --no-deps -e packages/cremore-siem-slack
          python -m pytest -q packages/cremore-siem-slack/tests cremore/siem/outbox_test.py
      - name: Check the Jira ticket-system plugin against a synthetic Jira
        run: |
          pip install --no-deps -e packages/cremore-ticket-jira
          python -m pytest -q packages/cremore-ticket-jira/tests cremore/ticketing

  web:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22.23.2
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci --ignore-scripts
        working-directory: web
      # Every non-browser suite; the *.browser.cjs files need Playwright and a
      # running stack, which CI does not provide.
      - run: npm test
        working-directory: web
      - run: npm run build
        working-directory: web
      # next/image is unused; its sharp/libvips (LGPL) binaries must not ship.
      - name: Standalone output carries no sharp/libvips
        working-directory: web
        run: |
          if find .next/standalone -path '*node_modules/sharp*' -o -path '*node_modules/@img*' -o -iname '*libvips*' | grep -q .; then
            echo "sharp/libvips found in .next/standalone" >&2; exit 1
          fi
      # The chart test renders with a digest-pinned Helm image and never pulls
      # during the test itself (--pull never, --network none); fetch it first.
      - name: Fetch pinned Helm image
        run: docker pull "$(node -p 'require("fs").readFileSync("deploy/helm/tests/chart.test.cjs","utf8").match(/const image = "([^"]+)"/)[1]')"
      - name: Lint and render Helm chart
        run: node --test deploy/helm/tests/chart.test.cjs

  # The synthetic browser proofs drive the real React UI in headless Chrome
  # (preinstalled on ubuntu-latest) with in-memory fixtures; every provider and
  # external request is denied inside the proofs.
  browser:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22.23.2
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci --ignore-scripts
        working-directory: web
      - name: Chrome for the proofs
        run: google-chrome --version
      - run: npm run test:browser
        working-directory: web
        env:
          # The runner context exists only inside steps; proof artifacts land here.
          TMPDIR: ${{ runner.temp }}
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: failure()
        with:
          name: browser-proofs
          retention-days: 14
          path: |
            ${{ runner.temp }}/cremore-browser-proofs-*
            work/
          if-no-files-found: ignore

  containers:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          # api and worker share the Python image; the service picks the entrypoint.
          - component: api
            context: .
            file: deploy/docker/python.Dockerfile
          - component: web
            context: .
            file: web/Dockerfile
          - component: oauth2-proxy
            context: .
            file: deploy/docker/oauth2-proxy.Dockerfile
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3
      - id: build
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.file }}
          push: false
          load: true
          tags: cremore-ci:${{ matrix.component }}
          cache-from: type=gha,scope=${{ matrix.component }}
          cache-to: type=gha,mode=max,scope=${{ matrix.component }}
      # Reuse the images above for Security's pinned scanner on every PR.
      # Security also audits application images on manual and weekly runs.
      - name: Audit application image with the pinned security scanner
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        env:
          IMAGE: cremore-ci:${{ matrix.component }}
        run: |
          docker run --rm \
            -v /var/run/docker.sock:/var/run/docker.sock \
            -v "$RUNNER_TEMP/trivy-security:/root/.cache" \
            aquasec/trivy:0.74.0@sha256:62b1e65e8869bc4b4c6aa4fa2b21595256c7c2f6018a9d9ad61caf87187c1969 image \
            --scanners vuln --severity HIGH,CRITICAL --ignore-unfixed \
            --skip-files usr/local/bin/gosu --exit-code 1 --no-progress "$IMAGE"
      - uses: aquasecurity/trivy-action@a9c7b0f06e461e9d4b4d1711f154ee024b8d7ab8 # v0.36.0
        # Run both scanners even if the other one reports findings.
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        with:
          image-ref: cremore-ci:${{ matrix.component }}
          format: table
          exit-code: "1"
          severity: HIGH,CRITICAL
