AWSTemplateFormatVersion: '2010-09-09'
Description: Read-only scanner, optional vault value-reader and optional separate remediation roles for CreMore.

Parameters:
  DeploymentMode:
    Type: String
    AllowedValues: [SingleAccount, Organization]
    Default: SingleAccount
    Description: >-
      SingleAccount (default): a hand-created stack in one account; TargetAccountId
      must equal that account. Organization: a service-managed StackSet fans this
      template across the org/OUs, where one TargetAccountId cannot match every
      account, so the account-match check is skipped and OrganizationId is required
      instead (the role trust is then scoped by aws:PrincipalOrgID + ExternalId).
  TargetAccountId:
    Type: String
    AllowedPattern: '^$|^[0-9]{12}$'
    Default: ''
    Description: >-
      SingleAccount mode: the AWS account this stack is created in (asserted to
      match AWS::AccountId). Organization mode: unused, leave empty.
  SecurityAccountId:
    Type: String
    Default: ''
    AllowedPattern: '^$|^[0-9]{12}$'
    Description: TrustedPrincipalType CentralRole only. Account of the central scanner role.
  CentralScannerRoleName:
    Type: String
    Default: PlatformScannerExecutionRole
    AllowedPattern: '^[A-Za-z0-9+=,.@_/-]{1,512}$'
    Description: IAM role name, including its path, used by the platform scanner.
  MemberScannerRoleName:
    Type: String
    Default: CredentialExposureScannerRole
    AllowedPattern: '^[A-Za-z0-9+=,.@_-]{1,64}$'
    Description: IAM role name created in this target account.
  MemberRemediationRoleName:
    Type: String
    Default: CredentialExposureRemediationRole
    AllowedPattern: '^[A-Za-z0-9+=,.@_-]{1,64}$'
    Description: Optional remediation IAM role name created in this target account.
  CentralRemediationRoleName:
    Type: String
    Default: PlatformRemediationExecutionRole
  OrganizationId:
    Type: String
    Default: ''
  ExternalId:
    Type: String
    MinLength: 16
    MaxLength: 128
    AllowedPattern: '^[A-Za-z0-9+=,.@:/_-]{16,128}$'
    Description: Unique value generated by the platform onboarding API. It is an identifier, not a password.
  EnableRemediation:
    Type: String
    AllowedValues: ['true', 'false']
    Default: 'false'
  EnableDeleteRemediation:
    Type: String
    AllowedValues: ['true', 'false']
    Default: 'false'
  EnableKmsDecrypt:
    Type: String
    AllowedValues: ['true', 'false']
    Default: 'false'
  KmsKeyArns:
    Type: CommaDelimitedList
    Description: Explicit customer-managed key ARNs. Replace the non-existent safe sentinel before enabling KMS decryption.
    Default: arn:aws:kms:us-east-1:000000000000:key/00000000-0000-0000-0000-000000000000
  CloudTrailLakeEventDataStoreArn:
    Type: String
    Default: ''
    Description: Optional exact event data store ARN. Lake queries remain disabled when empty.
  EnableControlTowerContext:
    Type: String
    AllowedValues: ['true', 'false']
    Default: 'false'
    Description: Enable only on an explicitly approved Control Tower management-account role to read baseline context.
  TrustedPrincipalType:
    Type: String
    AllowedValues: [CentralRole, IamRole, IamUser, IdentityCenter]
    Default: CentralRole
    Description: >-
      Who may assume the scanner role. The CreMore dashboard fills this with the AWS identity it runs as.
      CentralRole keeps the SecurityAccountId/CentralScannerRoleName trust of security-account.yaml.
  TrustedPrincipalArn:
    Type: String
    Default: ''
    AllowedPattern: '^$|^arn:aws(-[a-z]+)*:iam::[0-9]{12}:(role|user)/[A-Za-z0-9+=,.@_/-]{1,512}$'
    Description: IamRole or IamUser only. Exact IAM role (with path) or user ARN; never a session ARN.
  IdentityCenterAccountId:
    Type: String
    Default: ''
    AllowedPattern: '^$|^[0-9]{12}$'
    Description: IdentityCenter only. Account where the permission set role that runs CreMore lives.
  TrustedPrincipalPattern:
    Type: String
    Default: ''
    AllowedPattern: '^$|^arn:aws(-[a-z]+)*:iam::[0-9]{12}:role/aws-reserved/sso\.amazonaws\.com/([a-z]{2,4}(-[a-z]+)+-[0-9]/)?AWSReservedSSO_[A-Za-z0-9+=,.@_-]{1,32}_[?]{16}$'
    Description: >-
      IdentityCenter only. aws:PrincipalArn pattern for one permission set; the 16 ? match the role
      suffix, which changes when Identity Center re-creates the role, and nothing longer.
  RemediationTrustedPrincipalType:
    Type: String
    AllowedValues: [CentralRole, IamRole, IamUser, IdentityCenter]
    Default: CentralRole
    Description: >-
      Who may assume the remediation role (EnableRemediation=true only). The CreMore dashboard fills this
      with the separately approved remediation identity. CentralRole keeps the central remediation role trust.
  RemediationTrustedPrincipalArn:
    Type: String
    Default: ''
    AllowedPattern: '^$|^arn:aws(-[a-z]+)*:iam::[0-9]{12}:(role|user)/[A-Za-z0-9+=,.@_/-]{1,512}$'
    Description: Remediation IamRole or IamUser only. Exact IAM role (with path) or user ARN.
  RemediationIdentityCenterAccountId:
    Type: String
    Default: ''
    AllowedPattern: '^$|^[0-9]{12}$'
    Description: Remediation IdentityCenter only. Account of the remediation permission set role.
  RemediationTrustedPrincipalPattern:
    Type: String
    Default: ''
    AllowedPattern: '^$|^arn:aws(-[a-z]+)*:iam::[0-9]{12}:role/aws-reserved/sso\.amazonaws\.com/([a-z]{2,4}(-[a-z]+)+-[0-9]/)?AWSReservedSSO_[A-Za-z0-9+=,.@_-]{1,32}_[?]{16}$'
    Description: Remediation IdentityCenter only. aws:PrincipalArn pattern for the remediation permission set.
  EnableVaultValueRead:
    Type: String
    AllowedValues: ['true', 'false']
    Default: 'false'
    Description: >-
      Also create the value-reader role for vault comparison. Only the scanner role of this stack may assume it,
      with the ExternalId; it reads the values of the secrets and Parameter Store paths listed below. The scanner
      role itself still reads no value.
  VaultValueReaderRoleName:
    Type: String
    Default: CredentialVaultValueReaderRole
    AllowedPattern: '^[A-Za-z0-9+=,.@_-]{1,64}$'
    Description: IAM role name of the value-reader role (EnableVaultValueRead=true only).
  VaultSecretArns:
    Type: CommaDelimitedList
    Default: ''
    AllowedPattern: '^$|^arn:(aws|aws-us-gov|aws-cn|aws-eusc):secretsmanager:[a-z0-9-]+:[0-9]{12}:secret:[A-Za-z0-9/_+=.@-]+-[A-Za-z0-9]{6}$'
    Description: Exact Secrets Manager secret ARNs, with their six-character suffix, whose values the role may read.
  VaultParameterPathArns:
    Type: CommaDelimitedList
    Default: ''
    AllowedPattern: '^$|^arn:aws(-[a-z]+)*:ssm:([a-z0-9-]+|[*]):[0-9]{12}:parameter(/[A-Za-z0-9_.-]+)+(/[*])?$'
    Description: >-
      Parameter Store path ARNs GetParametersByPath may read, such as arn:aws:ssm:us-east-1:123456789012:parameter/prod
      and arn:aws:ssm:us-east-1:123456789012:parameter/prod/*. IAM authorizes that call on the requested path.
  VaultKmsKeyArns:
    Type: CommaDelimitedList
    Default: ''
    AllowedPattern: '^$|^arn:aws(-[a-z]+)*:kms:[a-z0-9-]+:[0-9]{12}:key/[A-Za-z0-9-]+$'
    Description: >-
      Optional customer-managed KMS key ARNs of those secrets and parameters. The role may decrypt with them only
      through Secrets Manager or Parameter Store (kms:ViaService).

Conditions:
  HasOrganizationId: !Not [!Equals [!Ref OrganizationId, '']]
  TrustsCentralRole: !Equals [!Ref TrustedPrincipalType, CentralRole]
  TrustsIdentityCenter: !Equals [!Ref TrustedPrincipalType, IdentityCenter]
  RemediationTrustsCentralRole: !Equals [!Ref RemediationTrustedPrincipalType, CentralRole]
  RemediationTrustsIdentityCenter: !Equals [!Ref RemediationTrustedPrincipalType, IdentityCenter]
  RemediationEnabled: !Equals [!Ref EnableRemediation, 'true']
  DeleteEnabled: !And [!Condition RemediationEnabled, !Equals [!Ref EnableDeleteRemediation, 'true']]
  KmsEnabled: !Equals [!Ref EnableKmsDecrypt, 'true']
  HasCloudTrailLake: !Not [!Equals [!Ref CloudTrailLakeEventDataStoreArn, '']]
  ControlTowerContextEnabled: !Equals [!Ref EnableControlTowerContext, 'true']
  VaultValueReadEnabled: !Equals [!Ref EnableVaultValueRead, 'true']
  # An empty list never makes an empty or wildcard statement: its policy is left out.
  HasVaultSecretArns: !And [!Condition VaultValueReadEnabled, !Not [!Equals [!Join ['', !Ref VaultSecretArns], '']]]
  HasVaultParameterPathArns: !And [!Condition VaultValueReadEnabled, !Not [!Equals [!Join ['', !Ref VaultParameterPathArns], '']]]
  HasVaultKmsKeyArns: !And [!Condition VaultValueReadEnabled, !Not [!Equals [!Join ['', !Ref VaultKmsKeyArns], '']]]

Rules:
  # SingleAccount only: proves the operator is signed in to the account they named.
  # StackSet (Organization) passes uniform parameters, so a single TargetAccountId
  # cannot match every target account; the org/OU scoping is enforced separately.
  TargetAccountMustMatch:
    RuleCondition: !Equals [!Ref DeploymentMode, 'SingleAccount']
    Assertions:
      - Assert:
          Fn::Equals:
            - !Ref TargetAccountId
            - !Ref AWS::AccountId
        AssertDescription: Sign in to the target AWS account before creating this stack.
  OrganizationModeRequiresOrgId:
    RuleCondition: !Equals [!Ref DeploymentMode, 'Organization']
    Assertions:
      - Assert: !Not [!Equals [!Ref OrganizationId, '']]
        AssertDescription: Organization mode requires OrganizationId so the role trust is scoped by aws:PrincipalOrgID.
  CentralRoleTrust:
    RuleCondition: !Equals [!Ref TrustedPrincipalType, CentralRole]
    Assertions:
      - Assert: !Not [!Equals [!Ref SecurityAccountId, '']]
        AssertDescription: CentralRole trust requires SecurityAccountId.
  IamPrincipalTrust:
    RuleCondition: !Or [!Equals [!Ref TrustedPrincipalType, IamRole], !Equals [!Ref TrustedPrincipalType, IamUser]]
    Assertions:
      - Assert: !Not [!Equals [!Ref TrustedPrincipalArn, '']]
        AssertDescription: IamRole and IamUser trust require TrustedPrincipalArn.
  IdentityCenterTrust:
    RuleCondition: !Equals [!Ref TrustedPrincipalType, IdentityCenter]
    Assertions:
      - Assert: !And [!Not [!Equals [!Ref IdentityCenterAccountId, '']], !Not [!Equals [!Ref TrustedPrincipalPattern, '']]]
        AssertDescription: IdentityCenter trust requires IdentityCenterAccountId and TrustedPrincipalPattern.
  RemediationCentralRoleTrust:
    RuleCondition: !And [!Equals [!Ref EnableRemediation, 'true'], !Equals [!Ref RemediationTrustedPrincipalType, CentralRole]]
    Assertions:
      - Assert: !Not [!Equals [!Ref SecurityAccountId, '']]
        AssertDescription: CentralRole remediation trust requires SecurityAccountId.
  RemediationIamPrincipalTrust:
    RuleCondition: !And [!Equals [!Ref EnableRemediation, 'true'], !Or [!Equals [!Ref RemediationTrustedPrincipalType, IamRole], !Equals [!Ref RemediationTrustedPrincipalType, IamUser]]]
    Assertions:
      - Assert: !Not [!Equals [!Ref RemediationTrustedPrincipalArn, '']]
        AssertDescription: IamRole and IamUser remediation trust require RemediationTrustedPrincipalArn.
  RemediationIdentityCenterTrust:
    RuleCondition: !And [!Equals [!Ref EnableRemediation, 'true'], !Equals [!Ref RemediationTrustedPrincipalType, IdentityCenter]]
    Assertions:
      - Assert: !And [!Not [!Equals [!Ref RemediationIdentityCenterAccountId, '']], !Not [!Equals [!Ref RemediationTrustedPrincipalPattern, '']]]
        AssertDescription: IdentityCenter remediation trust requires RemediationIdentityCenterAccountId and RemediationTrustedPrincipalPattern.

Resources:
  ScannerRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Ref MemberScannerRoleName
      MaxSessionDuration: 3600
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Fn::If:
              - TrustsIdentityCenter
              # AWS-documented Identity Center trust: the account as principal,
              # narrowed to one permission set role by aws:PrincipalArn.
              - Effect: Allow
                Principal:
                  AWS: !Sub arn:${AWS::Partition}:iam::${IdentityCenterAccountId}:root
                Action: sts:AssumeRole
                Condition:
                  Fn::If:
                    - HasOrganizationId
                    - StringEquals:
                        sts:ExternalId: !Ref ExternalId
                        aws:PrincipalOrgID: !Ref OrganizationId
                      ArnLike:
                        aws:PrincipalArn: !Ref TrustedPrincipalPattern
                    - StringEquals:
                        sts:ExternalId: !Ref ExternalId
                      ArnLike:
                        aws:PrincipalArn: !Ref TrustedPrincipalPattern
              - Effect: Allow
                Principal:
                  AWS: !If
                    - TrustsCentralRole
                    - !Sub arn:${AWS::Partition}:iam::${SecurityAccountId}:role/${CentralScannerRoleName}
                    - !Ref TrustedPrincipalArn
                Action: sts:AssumeRole
                Condition:
                  Fn::If:
                    - HasOrganizationId
                    - StringEquals:
                        sts:ExternalId: !Ref ExternalId
                        aws:PrincipalOrgID: !Ref OrganizationId
                    - StringEquals:
                        sts:ExternalId: !Ref ExternalId
      Policies:
        - PolicyName: ScannerMutationDeny
          PolicyDocument: {
              "Version": "2012-10-17",
              "Statement": [
                {
                  "Sid": "DenyScannerSourceMutation",
                  "Effect": "Deny",
                  "Action": [
                    "s3:Put*",
                    "s3:Delete*",
                    "s3:Create*",
                    "s3:Update*",
                    "s3:Replicate*",
                    "s3:RestoreObject",
                    "s3:AbortMultipartUpload",
                    "s3:BypassGovernanceRetention",
                    "s3:InitiateReplication",
                    "s3:PauseReplication",
                    "s3:Write*",
                    "iam:Add*",
                    "iam:Attach*",
                    "iam:Change*",
                    "iam:Create*",
                    "iam:Deactivate*",
                    "iam:Delete*",
                    "iam:Detach*",
                    "iam:Enable*",
                    "iam:PassRole",
                    "iam:Put*",
                    "iam:Remove*",
                    "iam:Reset*",
                    "iam:Resync*",
                    "iam:Set*",
                    "iam:Tag*",
                    "iam:Untag*",
                    "iam:Update*",
                    "iam:Upload*",
                    "secretsmanager:Create*",
                    "secretsmanager:Delete*",
                    "secretsmanager:Put*",
                    "secretsmanager:Update*",
                    "secretsmanager:Rotate*",
                    "secretsmanager:Restore*",
                    "secretsmanager:Replicate*",
                    "secretsmanager:Remove*",
                    "secretsmanager:Stop*",
                    "secretsmanager:CancelRotateSecret",
                    "secretsmanager:Tag*",
                    "secretsmanager:Untag*",
                    "secretsmanager:GetSecretValue",
                    "secretsmanager:BatchGetSecretValue",
                    "cloudtrail:Create*",
                    "cloudtrail:Update*",
                    "cloudtrail:Delete*",
                    "cloudtrail:Put*",
                    "cloudtrail:StartLogging",
                    "cloudtrail:StopLogging",
                    "cloudtrail:AddTags",
                    "cloudtrail:RemoveTags",
                    "cloudtrail:RestoreEventDataStore",
                    "cloudtrail:EnableFederation",
                    "cloudtrail:DisableFederation",
                    "cloudtrail:StartEventDataStoreIngestion",
                    "cloudtrail:StopEventDataStoreIngestion",
                    "cloudtrail:StartImport",
                    "cloudtrail:StopImport",
                    "cloudtrail:RegisterOrganizationDelegatedAdmin",
                    "cloudtrail:DeregisterOrganizationDelegatedAdmin",
                    "events:Put*",
                    "events:Create*",
                    "events:Update*",
                    "events:Delete*",
                    "events:Remove*",
                    "events:EnableRule",
                    "events:DisableRule",
                    "sqs:CreateQueue",
                    "sqs:DeleteQueue",
                    "sqs:PurgeQueue",
                    "sqs:SetQueueAttributes",
                    "sqs:AddPermission",
                    "sqs:RemovePermission",
                    "kms:Create*",
                    "kms:Delete*",
                    "kms:Disable*",
                    "kms:Enable*",
                    "kms:Put*",
                    "kms:Update*",
                    "kms:Schedule*",
                    "kms:CancelKeyDeletion",
                    "kms:Tag*",
                    "kms:Untag*",
                    "kms:RevokeGrant",
                    "kms:RetireGrant",
                    "kms:ImportKeyMaterial",
                    "kms:ReplicateKey"
                  ],
                  "Resource": "*"
                }
              ]
            }
        - PolicyName: CredentialExposureReadOnlyS3AndIAM
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Sid: BucketDiscovery
                Effect: Allow
                Action:
                  - s3:ListAllMyBuckets
                  - s3:GetBucketLocation
                Resource: '*'
              - Sid: ObjectDiscoveryAndRead
                Effect: Allow
                Action:
                  - s3:ListBucket
                  - s3:ListBucketVersions
                  - s3:GetBucketVersioning
                  - s3:GetBucketTagging
                  # Read-only checks of whether a bucket is reachable from the
                  # internet. Without them a credential found in a public
                  # bucket is scored the same as one in a private bucket.
                  - s3:GetBucketPolicyStatus
                  - s3:GetBucketPublicAccessBlock
                  # Who can read the bucket a credential was found in.
                  - s3:GetBucketPolicy
                  - s3:GetBucketAcl
                Resource: !Sub "arn:${AWS::Partition}:s3:::*"
              - Sid: ObjectRead
                Effect: Allow
                Action:
                  - s3:GetObject
                  - s3:GetObjectVersion
                  - s3:GetObjectTagging
                  - s3:GetObjectAcl
                Resource: !Sub "arn:${AWS::Partition}:s3:::*/*"
              - Sid: IAMEnrichment
                Effect: Allow
                Action:
                  - iam:GetAccessKeyLastUsed
                  - iam:ListAccessKeys
                  - iam:GetUser
                  - iam:ListUserTags
                  - iam:GenerateCredentialReport
                  - iam:GetCredentialReport

                  # Live paginated identity discovery; reports alone may lag four hours.
                  - iam:ListUsers
                  - iam:ListServiceSpecificCredentials
                  - iam:SimulatePrincipalPolicy
                  # Read the principal's identity policy documents as written.
                  - iam:ListUserPolicies
                  - iam:GetUserPolicy
                  - iam:ListAttachedUserPolicies
                  - iam:ListGroupsForUser
                  - iam:ListGroupPolicies
                  - iam:GetGroupPolicy
                  - iam:ListAttachedGroupPolicies
                  - iam:GetRole
                  - iam:ListRolePolicies
                  - iam:GetRolePolicy
                  - iam:ListAttachedRolePolicies
                  - iam:GetPolicy
                  - iam:GetPolicyVersion
                  - sts:GetCallerIdentity
                Resource: '*'
              - Sid: ObservedCredentialUsage
                Effect: Allow
                Action:
                  - cloudtrail:LookupEvents
                  - ec2:DescribeRegions
                Resource: '*'
              - Sid: SecretsManagerMetadata
                Effect: Allow
                Action:
                  - secretsmanager:ListSecrets
                  - secretsmanager:DescribeSecret
                  - secretsmanager:ListSecretVersionIds
                  - secretsmanager:GetResourcePolicy
                Resource: '*'
              - Sid: KmsKeyPolicyRead
                Effect: Allow
                Action:
                  # Whether a key's policy lets IAM policies grant its use; this account's keys only.
                  - kms:GetKeyPolicy
                Resource: !Sub "arn:${AWS::Partition}:kms:*:${AWS::AccountId}:key/*"
              - Sid: ParameterStoreMetadata
                Effect: Allow
                Action:
                  # Names and types only; DescribeParameters takes no narrower resource.
                  - ssm:DescribeParameters
                Resource: '*'
        - !If
          - KmsEnabled
          - PolicyName: ExplicitKmsDecrypt
            PolicyDocument:
              Version: '2012-10-17'
              Statement:
                - Effect: Allow
                  Action: kms:Decrypt
                  Resource: !Ref KmsKeyArns
          - !Ref AWS::NoValue
        - !If
          - HasCloudTrailLake
          - PolicyName: QueryConfiguredCloudTrailLake
            PolicyDocument:
              Version: '2012-10-17'
              Statement:
                - Effect: Allow
                  Action: cloudtrail:StartQuery
                  Resource: !Ref CloudTrailLakeEventDataStoreArn
                - Effect: Allow
                  Action: cloudtrail:GetQueryResults
                  Resource: '*'
          - !Ref AWS::NoValue

        - !If
          - ControlTowerContextEnabled
          - PolicyName: ControlTowerInventoryContext
            PolicyDocument:
              Version: '2012-10-17'
              Statement:
                - Effect: Allow
                  Action: [controltower:ListBaselines, controltower:ListEnabledBaselines, controltower:GetEnabledBaseline]
                  Resource: '*'
          - !Ref AWS::NoValue
        - !If
          - VaultValueReadEnabled
          # The scanner session reads no value; for vault comparison it may become this account's value reader.
          - PolicyName: AssumeVaultValueReader
            PolicyDocument:
              Version: '2012-10-17'
              Statement:
                - Effect: Allow
                  Action: sts:AssumeRole
                  Resource: !Sub arn:${AWS::Partition}:iam::${AWS::AccountId}:role/${VaultValueReaderRoleName}
          - !Ref AWS::NoValue

  VaultValueReaderRole:
    Type: AWS::IAM::Role
    Condition: VaultValueReadEnabled
    Properties:
      RoleName: !Ref VaultValueReaderRoleName
      # Reached only by role chaining from the scanner session, which AWS caps at one hour.
      MaxSessionDuration: 3600
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              AWS: !GetAtt ScannerRole.Arn
            Action: sts:AssumeRole
            Condition:
              StringEquals:
                sts:ExternalId: !Ref ExternalId
      Policies:
        # The scanner's mutation deny without GetSecretValue, the value reads CreMore does not use and Parameter Store changes.
        - PolicyName: VaultValueReaderDeny
          PolicyDocument: {
              "Version": "2012-10-17",
              "Statement": [
                {
                  "Sid": "DenyValueReaderMutationAndUnusedReads",
                  "Effect": "Deny",
                  "Action": [
                    "s3:Put*",
                    "s3:Delete*",
                    "s3:Create*",
                    "s3:Update*",
                    "s3:Replicate*",
                    "s3:RestoreObject",
                    "s3:AbortMultipartUpload",
                    "s3:BypassGovernanceRetention",
                    "s3:InitiateReplication",
                    "s3:PauseReplication",
                    "s3:Write*",
                    "iam:Add*",
                    "iam:Attach*",
                    "iam:Change*",
                    "iam:Create*",
                    "iam:Deactivate*",
                    "iam:Delete*",
                    "iam:Detach*",
                    "iam:Enable*",
                    "iam:PassRole",
                    "iam:Put*",
                    "iam:Remove*",
                    "iam:Reset*",
                    "iam:Resync*",
                    "iam:Set*",
                    "iam:Tag*",
                    "iam:Untag*",
                    "iam:Update*",
                    "iam:Upload*",
                    "secretsmanager:Create*",
                    "secretsmanager:Delete*",
                    "secretsmanager:Put*",
                    "secretsmanager:Update*",
                    "secretsmanager:Rotate*",
                    "secretsmanager:Restore*",
                    "secretsmanager:Replicate*",
                    "secretsmanager:Remove*",
                    "secretsmanager:Stop*",
                    "secretsmanager:CancelRotateSecret",
                    "secretsmanager:Tag*",
                    "secretsmanager:Untag*",
                    "secretsmanager:BatchGetSecretValue",
                    "ssm:GetParameter",
                    "ssm:GetParameters",
                    "ssm:GetParameterHistory",
                    "ssm:PutParameter",
                    "ssm:DeleteParameter*",
                    "ssm:LabelParameterVersion",
                    "ssm:UnlabelParameterVersion",
                    "ssm:AddTagsToResource",
                    "ssm:RemoveTagsFromResource",
                    "ssm:PutResourcePolicy",
                    "ssm:DeleteResourcePolicy",
                    "cloudtrail:Create*",
                    "cloudtrail:Update*",
                    "cloudtrail:Delete*",
                    "cloudtrail:Put*",
                    "cloudtrail:StartLogging",
                    "cloudtrail:StopLogging",
                    "cloudtrail:AddTags",
                    "cloudtrail:RemoveTags",
                    "cloudtrail:RestoreEventDataStore",
                    "cloudtrail:EnableFederation",
                    "cloudtrail:DisableFederation",
                    "cloudtrail:StartEventDataStoreIngestion",
                    "cloudtrail:StopEventDataStoreIngestion",
                    "cloudtrail:StartImport",
                    "cloudtrail:StopImport",
                    "cloudtrail:RegisterOrganizationDelegatedAdmin",
                    "cloudtrail:DeregisterOrganizationDelegatedAdmin",
                    "events:Put*",
                    "events:Create*",
                    "events:Update*",
                    "events:Delete*",
                    "events:Remove*",
                    "events:EnableRule",
                    "events:DisableRule",
                    "sqs:CreateQueue",
                    "sqs:DeleteQueue",
                    "sqs:PurgeQueue",
                    "sqs:SetQueueAttributes",
                    "sqs:AddPermission",
                    "sqs:RemovePermission",
                    "kms:Create*",
                    "kms:Delete*",
                    "kms:Disable*",
                    "kms:Enable*",
                    "kms:Put*",
                    "kms:Update*",
                    "kms:Schedule*",
                    "kms:CancelKeyDeletion",
                    "kms:Tag*",
                    "kms:Untag*",
                    "kms:RevokeGrant",
                    "kms:RetireGrant",
                    "kms:ImportKeyMaterial",
                    "kms:ReplicateKey"
                  ],
                  "Resource": "*"
                }
              ]
            }
        # The allow below is only the role's own policy: a secret whose resource policy lets the
        # organization in (Principal "*" with aws:PrincipalOrgID) would still be readable without this deny.
        - PolicyName: VaultValueReaderListedSecretsOnly
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - !If
                - HasVaultSecretArns
                - Effect: Deny
                  Action: [secretsmanager:GetSecretValue, secretsmanager:DescribeSecret, secretsmanager:ListSecretVersionIds]
                  NotResource: !Ref VaultSecretArns
                - Effect: Deny
                  Action: [secretsmanager:GetSecretValue, secretsmanager:DescribeSecret, secretsmanager:ListSecretVersionIds]
                  Resource: '*'
        - !If
          - HasVaultSecretArns
          - PolicyName: ReadListedSecretValues
            PolicyDocument:
              Version: '2012-10-17'
              Statement:
                - Effect: Allow
                  Action:
                    - secretsmanager:GetSecretValue
                    - secretsmanager:DescribeSecret
                    - secretsmanager:ListSecretVersionIds
                  Resource: !Ref VaultSecretArns
          - !Ref AWS::NoValue
        - !If
          - HasVaultParameterPathArns
          - PolicyName: ReadListedParameterPaths
            PolicyDocument:
              Version: '2012-10-17'
              Statement:
                - Effect: Allow
                  Action: ssm:GetParametersByPath
                  Resource: !Ref VaultParameterPathArns
          - !Ref AWS::NoValue
        - !If
          - HasVaultKmsKeyArns
          - PolicyName: DecryptThroughSecretStores
            PolicyDocument:
              Version: '2012-10-17'
              Statement:
                - Effect: Allow
                  Action: kms:Decrypt
                  Resource: !Ref VaultKmsKeyArns
                  # Only a decryption Secrets Manager or Parameter Store asks for; never an arbitrary ciphertext.
                  Condition:
                    StringLike:
                      kms:ViaService:
                        - secretsmanager.*.amazonaws.com
                        - ssm.*.amazonaws.com
                        - secretsmanager.*.amazonaws.com.cn
                        - ssm.*.amazonaws.com.cn
          - !Ref AWS::NoValue

  RemediationRole:
    Type: AWS::IAM::Role
    Condition: RemediationEnabled
    Properties:
      RoleName: !Ref MemberRemediationRoleName
      MaxSessionDuration: 3600
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Fn::If:
              - RemediationTrustsIdentityCenter
              - Effect: Allow
                Principal:
                  AWS: !Sub arn:${AWS::Partition}:iam::${RemediationIdentityCenterAccountId}:root
                Action: sts:AssumeRole
                Condition:
                  Fn::If:
                    - HasOrganizationId
                    - StringEquals:
                        sts:ExternalId: !Ref ExternalId
                        aws:PrincipalOrgID: !Ref OrganizationId
                      ArnLike:
                        aws:PrincipalArn: !Ref RemediationTrustedPrincipalPattern
                    - StringEquals:
                        sts:ExternalId: !Ref ExternalId
                      ArnLike:
                        aws:PrincipalArn: !Ref RemediationTrustedPrincipalPattern
              - Effect: Allow
                Principal:
                  AWS: !If
                    - RemediationTrustsCentralRole
                    - !Sub arn:${AWS::Partition}:iam::${SecurityAccountId}:role/${CentralRemediationRoleName}
                    - !Ref RemediationTrustedPrincipalArn
                Action: sts:AssumeRole
                Condition:
                  Fn::If:
                    - HasOrganizationId
                    - StringEquals:
                        sts:ExternalId: !Ref ExternalId
                        aws:PrincipalOrgID: !Ref OrganizationId
                    - StringEquals:
                        sts:ExternalId: !Ref ExternalId
      Policies:
        - PolicyName: CredentialExposureAccessKeyRemediation
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action:
                  - iam:ListAccessKeys
                  - iam:GetUser
                  - iam:UpdateAccessKey
                Resource: !Sub "arn:${AWS::Partition}:iam::*:user/*"
              - !If
                - DeleteEnabled
                - Effect: Allow
                  Action: iam:DeleteAccessKey
                  Resource: !Sub "arn:${AWS::Partition}:iam::*:user/*"
                - !Ref AWS::NoValue
              - Effect: Allow
                Action:
                  - sts:GetCallerIdentity
                  - iam:GetAccessKeyLastUsed
                Resource: '*'

Outputs:
  ScannerRoleArn:
    Value: !GetAtt ScannerRole.Arn
  RemediationRoleArn:
    Condition: RemediationEnabled
    Value: !GetAtt RemediationRole.Arn
  VaultValueReaderRoleArn:
    Condition: VaultValueReadEnabled
    Value: !GetAtt VaultValueReaderRole.Arn
