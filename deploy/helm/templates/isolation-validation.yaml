{{- if not (kindIs "bool" .Values.isolation.enabled) }}{{ fail "isolation.enabled must be a boolean" }}{{ end }}
{{- if .Values.isolation.enabled -}}
{{- if not .Values.networkPolicy.enabled }}{{ fail "isolation requires NetworkPolicy enforcement by the cluster CNI" }}{{ end }}
{{- if has .Values.networkPolicy.databaseCIDR (list "0.0.0.0/0" "::/0" "") }}{{ fail "isolation requires an explicit database network" }}{{ end }}
{{- if regexMatch "(?i)^(169\\.254\\.|fd00:ec2:)" .Values.networkPolicy.databaseCIDR }}{{ fail "isolation database network cannot be a workload credential agent" }}{{ end }}
{{- if .Values.networkPolicy.eksPodIdentity }}{{ fail "isolation: list identity-agent egress only on the collector/remediator that uses it" }}{{ end }}
{{- if or .Values.applicationSecret.sealingKey .Values.applicationSecret.sealingKeyPrevious .Values.config.sealing.kmsKeyId .Values.config.sealing.vaultPath }}
{{- fail "isolation cannot mount legacy shared sealing roots; migrate offline first" }}
{{- end }}
{{- $seen := dict }}
{{- range $role := list "api" "worker" "remediator" "control" "migrator" }}
{{- $secret := index $.Values.isolation.databaseSecrets $role }}
{{- if or (empty $secret) (hasKey $seen $secret) }}{{ fail "isolation requires distinct database secrets per runtime and migration role" }}{{ end }}
{{- $_ := set $seen $secret true }}
{{- end }}
{{- $keySecrets := dict }}
{{- range $field := list "collectorPrivateKeysSecret" "remediatorPrivateKeysSecret" "controlKeySecret" }}
{{- $secret := index $.Values.isolation $field }}
{{- if or (empty $secret) (hasKey $keySecrets $secret) }}{{ fail "collector, remediator and control keys require distinct non-empty secrets" }}{{ end }}
{{- $_ := set $keySecrets $secret true }}
{{- end }}
{{- /* Whole Secret mounts and envFrom must never expose a role's key file to another role. */}}
{{- range $secret := list .Values.applicationSecret.name .Values.internalTLS.apiSecretName .Values.internalTLS.webSecretName .Values.internalTLS.caSecretName .Values.databaseTLS.caSecretName .Values.auth.oidc.secret.name .Values.secretStore.secretName .Values.gcp.oauth.secretName .Values.gcp.adcSecretName .Values.aws.rolesAnywhere.secretName .Values.isolation.remediatorIdentity.gcp.adcSecretName .Values.isolation.remediatorIdentity.aws.rolesAnywhere.secretName .Values.siem.tokenSecretName .Values.siem.tlsSecretName }}
{{- if and $secret (hasKey $keySecrets $secret) }}{{ fail "role sealing key secrets must not be reused by other credential or TLS mounts" }}{{ end }}
{{- end }}
{{- if .Values.siem.enabled }}
{{- range $secret := list .Values.siem.tokenSecretName .Values.siem.tlsSecretName }}
{{- if and $secret (or (hasKey $seen $secret) (eq $secret $.Values.applicationSecret.name) (eq $secret $.Values.auth.oidc.secret.name) (eq $secret $.Values.secretStore.secretName) (eq $secret $.Values.gcp.oauth.secretName) (eq $secret $.Values.gcp.adcSecretName) (eq $secret $.Values.aws.rolesAnywhere.secretName) (eq $secret $.Values.isolation.remediatorIdentity.gcp.adcSecretName) (eq $secret $.Values.isolation.remediatorIdentity.aws.rolesAnywhere.secretName)) }}{{ fail "SIEM destination secrets must be separate from application and workload credentials" }}{{ end }}
{{- end }}
{{- end }}
{{- range $field := list "publicKeysConfigMap" "approvalPublicKeyConfigMap" }}
{{- $_ := required (printf "isolation.%s is required" $field) (index $.Values.isolation $field) }}
{{- end }}
{{- $accounts := dict }}
{{- range $name := list "api" "worker" "remediator" "control" "web" "siem" "migrator" }}
{{- $account := index $.Values.serviceAccounts $name }}
{{- $accountName := include "cremore.serviceAccountName" (dict "root" $ "component" $name) }}
{{- if or (eq $accountName "default") (hasKey $accounts $accountName) }}{{ fail "isolation requires distinct non-default service accounts for every role" }}{{ end }}
{{- $_ := set $accounts $accountName true }}
{{- if or (not (kindIs "bool" $account.automountServiceAccountToken)) $account.automountServiceAccountToken }}{{ fail "isolation forbids automatic Kubernetes API token mounts" }}{{ end }}
{{- if not (has $name (list "worker" "remediator")) }}
{{- range $key, $_ := $account.annotations }}
{{- if regexMatch "^(eks\\.amazonaws\\.com/|azure\\.workload\\.identity/|iam\\.gke\\.io/)" $key }}{{ fail "only collector/remediator service accounts may carry cloud workload identity annotations" }}{{ end }}
{{- end }}
{{- end }}
{{- range index $.Values.isolation.egress $name }}
{{- if or (empty .cidr) (has .cidr (list "0.0.0.0/0" "::/0")) (not (regexMatch "^[0-9]{1,5}$" (toString .port))) (lt (int .port) 1) (gt (int .port) 65535) }}
{{- fail "isolation egress requires explicit destination CIDRs and TCP ports" }}
{{- end }}
{{- if and (not (has $name (list "worker" "remediator"))) (regexMatch "(?i)^(169\\.254\\.|fd00:ec2:)" .cidr) }}{{ fail "only collector/remediator may reach workload credential agents" }}{{ end }}
{{- end }}
{{- end }}
{{- $aws := .Values.isolation.remediatorIdentity.aws }}
{{- if and $aws.webIdentity.enabled $aws.rolesAnywhere.enabled }}{{ fail "Choose one remediator AWS identity source" }}{{ end }}
{{- if and $aws.webIdentity.enabled (not (regexMatch "^arn:aws[a-z-]*:iam::[0-9]{12}:role/[A-Za-z0-9+=,.@_/-]+$" $aws.webIdentity.roleArn)) }}{{ fail "remediator requires an IAM role ARN" }}{{ end }}
{{- if $aws.webIdentity.enabled }}
{{- $_ := required "remediator AWS token audience is required" $aws.webIdentity.audience }}
{{- $seconds := toString $aws.webIdentity.expirationSeconds }}
{{- if or (not (regexMatch "^[0-9]+$" $seconds)) (lt (int $seconds) 600) (gt (int $seconds) 86400) }}{{ fail "remediator AWS token expiration must be 600..86400" }}{{ end }}
{{- end }}
{{- if and $aws.rolesAnywhere.enabled (empty $aws.rolesAnywhere.secretName) }}{{ fail "remediator Roles Anywhere secret is required" }}{{ end }}
{{- if and (or $aws.webIdentity.enabled $aws.rolesAnywhere.enabled) (hasKey .Values.serviceAccounts.remediator.annotations "eks.amazonaws.com/role-arn") }}{{ fail "Do not combine explicit remediator AWS identity with IRSA annotations" }}{{ end }}
{{- $collectorArn := default "" (index .Values.serviceAccounts.worker.annotations "eks.amazonaws.com/role-arn") }}
{{- if .Values.aws.webIdentity.enabled }}{{ $collectorArn = .Values.aws.webIdentity.roleArn }}{{ end }}
{{- $remediatorArn := default "" (index .Values.serviceAccounts.remediator.annotations "eks.amazonaws.com/role-arn") }}
{{- if $aws.webIdentity.enabled }}{{ $remediatorArn = $aws.webIdentity.roleArn }}{{ end }}
{{- if and $collectorArn (eq $collectorArn $remediatorArn) }}{{ fail "collector and remediator must not share an AWS role" }}{{ end }}
{{- if and .Values.aws.rolesAnywhere.enabled $aws.rolesAnywhere.enabled (eq .Values.aws.rolesAnywhere.secretName $aws.rolesAnywhere.secretName) }}{{ fail "collector and remediator must not share Roles Anywhere credentials" }}{{ end }}
{{- $gcp := .Values.isolation.remediatorIdentity.gcp }}
{{- if and $gcp.adcSecretName (empty $gcp.adcSecretKey) }}{{ fail "remediator GCP ADC secret key is required" }}{{ end }}
{{- if and $gcp.adcSecretName (eq $gcp.adcSecretName .Values.gcp.adcSecretName) }}{{ fail "collector and remediator must not share a GCP ADC secret" }}{{ end }}
{{- $azure := .Values.isolation.remediatorIdentity.azure.workloadIdentity }}
{{- $uuid := "^[0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{12}$" }}
{{- if $azure.enabled }}
{{- if not (regexMatch $uuid (toString $azure.clientId)) }}{{ fail "remediator Azure clientId must be an Entra application ID" }}{{ end }}
{{- if and $azure.tenantId (not (regexMatch $uuid (toString $azure.tenantId))) }}{{ fail "remediator Azure tenantId must be a tenant ID" }}{{ end }}
{{- $seconds := toString $azure.tokenExpirationSeconds }}
{{- if or (not (regexMatch "^[0-9]{4,5}$" $seconds)) (lt (int $seconds) 3600) (gt (int $seconds) 86400) }}{{ fail "remediator Azure token expiration must be 3600..86400" }}{{ end }}
{{- if and .Values.azure.workloadIdentity.enabled (eq (lower $azure.clientId) (lower .Values.azure.workloadIdentity.clientId)) }}{{ fail "collector and remediator must not share an Azure client ID" }}{{ end }}
{{- end }}
{{- range $key := list "iam.gke.io/gcp-service-account" "azure.workload.identity/client-id" }}
{{- $collector := default "" (index $.Values.serviceAccounts.worker.annotations $key) }}
{{- $remediator := default "" (index $.Values.serviceAccounts.remediator.annotations $key) }}
{{- if eq $key "azure.workload.identity/client-id" }}
{{- if $.Values.azure.workloadIdentity.enabled }}{{ $collector = $.Values.azure.workloadIdentity.clientId }}{{ end }}
{{- if $azure.enabled }}{{ $remediator = $azure.clientId }}{{ end }}
{{- end }}
{{- if and $collector (eq (lower $collector) (lower $remediator)) }}{{ fail "collector and remediator must use distinct cloud workload identities" }}{{ end }}
{{- end }}
{{- if and .Values.siem.enabled (hasKey $seen .Values.siem.databaseUrlSecret.name) }}{{ fail "SIEM requires its own database secret" }}{{ end }}
{{- end -}}
