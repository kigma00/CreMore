{{- $root := . -}}
{{- $components := list "api" "worker" "web" -}}
{{- if .Values.isolation.enabled }}{{ $components = concat $components (list "remediator" "control") }}{{ end }}
{{- if and .Values.isolation.enabled .Values.siem.enabled }}{{ $components = append $components "siem" }}{{ end }}
{{- if and .Values.isolation.enabled .Values.isolation.migrationJob.enabled }}{{ $components = append $components "migrator" }}{{ end }}
{{- range $name := $components }}
{{- $account := index $root.Values.serviceAccounts $name }}
{{- if $account.create }}
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "cremore.serviceAccountName" (dict "root" $root "component" $name) }}
  labels: {{ include "cremore.labels" (dict "root" $root "component" $name) | nindent 4 }}
  {{- $annotations := deepCopy ($account.annotations | default dict) }}
  {{- with $annotations }}
  annotations: {{ toYaml . | nindent 4 }}
  {{- end }}
automountServiceAccountToken: {{ $account.automountServiceAccountToken }}
{{- end }}
{{- end }}
