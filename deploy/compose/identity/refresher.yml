# Workload identity for a server without Kubernetes (docs/MACHINE_IDENTITY.md).
# cremore-token-refresher takes a client-credentials token from your IdP (Okta,
# Keycloak, Entra ID, ...) and keeps it current in a shared volume that the API
# and worker read. Add the cloud files that use it:
#
#   docker compose -f docker-compose.yml -f deploy/compose/identity/refresher.yml \
#     -f deploy/compose/identity/aws-web-identity.yml up -d
#
# The configuration file (IDENTITY_REFRESHER_CONFIG) names each token and where it
# goes: cloud tokens under /run/cremore-identity/cloud, a Vault connection's
# login token under /run/cremore-identity/vault. Secrets are environment names.
services:
  identity-refresher:
    image: cremore-python
    restart: unless-stopped
    command: [cremore-token-refresher, --config, /run/cremore/refresher.json]
    user: "${CREMORE_UID:-65532}:${CREMORE_GID:-65532}"
    environment:
      CREMORE_REFRESHER_HEARTBEAT_FILE: /tmp/cremore-token-refresher.heartbeat
      IDP_CLIENT_SECRET: ${IDP_CLIENT_SECRET:-}
    volumes:
      - type: bind
        source: ${IDENTITY_REFRESHER_CONFIG:?set an absolute path to the token refresher JSON}
        target: /run/cremore/refresher.json
        read_only: true
        bind: {create_host_path: false}
      - cremore-identity:/run/cremore-identity
    read_only: true
    tmpfs:
      - /tmp
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test: ["CMD", "python", "-c", "import os,sys,time;p='/tmp/cremore-token-refresher.heartbeat';sys.exit(0 if os.path.exists(p) and time.time()-os.path.getmtime(p)<90 else 1)"]
      interval: 30s
      timeout: 5s
      retries: 3
  api:
    volumes:
      - cremore-identity:/run/cremore-identity:ro
  worker:
    environment:
      # A Vault connection's server_auth names a file here, never a path.
      VAULT_CONNECTION_TOKEN_DIR: /run/cremore-identity/vault
    volumes:
      - cremore-identity:/run/cremore-identity:ro

volumes:
  cremore-identity: {}
