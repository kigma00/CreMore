# Receiver-owned configuration. Index is dedicated to one authenticated CreMore installation.
# Configure alert actions/destinations in the SIEM; no addresses or credentials belong here.
[CreMore heartbeat absent]
enableSched = 1
cron_schedule = */5 * * * *
dispatch.earliest_time = -30d
dispatch.latest_time = now
search = index=cremore_audit event_type="platform.heartbeat" | stats max(_indextime) as received | where isnull(received) OR now()-received>720
alert_type = number of events
alert_comparator = greater than
alert_threshold = 0

[CreMore audit anchor absent]
enableSched = 1
cron_schedule = */5 * * * *
dispatch.earliest_time = -30d
dispatch.latest_time = now
search = index=cremore_audit event_type="audit.chain_anchor" | stats max(_indextime) as received | where isnull(received) OR now()-received>7500
alert_type = number of events
alert_comparator = greater than
alert_threshold = 0

[CreMore audit chain discontinuity]
enableSched = 1
cron_schedule = */5 * * * *
dispatch.earliest_time = -30d
dispatch.latest_time = now
search = index=cremore_audit event_type="audit.chain_anchor" | dedup event_id | sort 0 audit.anchor_no | streamstats current=f window=1 last(audit.anchor_no) as prior_no last(audit.chain_seq) as prior_seq last(audit.genesis_mac) as prior_genesis | where 'audit.chain_state'!="INTACT" OR 'audit.open_problems'>0 OR (isnotnull(prior_no) AND ('audit.anchor_no'!=prior_no+1 OR 'audit.chain_seq'<prior_seq OR 'audit.genesis_mac'!=prior_genesis))
alert_type = number of events
alert_comparator = greater than
alert_threshold = 0

[CreMore conflicting anchor number]
enableSched = 1
cron_schedule = */5 * * * *
dispatch.earliest_time = -30d
dispatch.latest_time = now
search = index=cremore_audit event_type="audit.chain_anchor" | stats dc(audit.chain_mac) as heads dc(audit.genesis_mac) as starts by audit.anchor_no | where heads>1 OR starts>1
alert_type = number of events
alert_comparator = greater than
alert_threshold = 0
